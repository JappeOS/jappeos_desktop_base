name: jappeos_desktop_base
description: "Contains base widgets and tools used by the greeter and the desktop environment."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.9

dependencies:
  flutter:
    sdk: flutter

  shadcn_flutter:
    git:
      url: https://github.com/JappeOS/shadcn_flutter.git
      ref: master

  jappeos_services:
    git:
      url: https://github.com/JappeOS/jappeos_services.git
      ref: dev

  jdwm:
    git:
      url: https://github.com/JappeOS/jdwm.git
      ref: main

  nested: ^1.0.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true